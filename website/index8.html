<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first website with tables</title>
</head>
<body>
    <!-- Tables -->
    <h3>Store Hours</h3>
    <table bgcolor="black" width="700"> <!--Table with two rows here. It can have any number of rows--> <!--Table width decided = number of headers * width of each header-->
        <tr bgcolor="grey"> <!--ROW 1 = Days of the week -->
            <th width="100">Sunday</th> <!--Table Headers-->
            <th width="100">Monday</th>
            <th width="100">Tuesday</th>
            <th width="100">Wednesday</th>
            <th width="100">Thursday</th>
            <th width="100">Friday</th>
            <th width="100">Saturday</th>
        </tr>
        <tr bgcolor="lightgrey" align="center"><!--ROW 2 = Hours of operation-->
            <td>Closed</td> <!--Table Data-->
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>Closed</td>
        </tr>
    </table>
</body>
</html>

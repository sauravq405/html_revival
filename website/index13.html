<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My first website with buttons</title>
  </head>
  <body>
    <a href="https://www.google.com/">
      <button>click me</button>
    </a>
    <br />
    <a href="https://www.bing.com/">
      <button disabled>bing me</button>
    </a>
    <br />
    <a href="https://www.google.com/">
      <button style="background-color: #333333; color: #00FF00; border-radius: 5px">click me</button>
    </a>
    <p>
    <button onclick="doSomething()" style="background-color: #333333; color: #00FF00; border-radius: 5px">click me</button> 
    <p id="test">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Facilis, ipsam fugiat tempore in maxime corrupti natus? Reiciendis provident eos est incidunt ab. Distinctio voluptates voluptatibus eaque sunt molestiae modi commodi!</p>
    <script>
        function doSomething(){
            document.getElementById("test").innerHTML = "Goodbye";
        }
    </script>
  </body>
</html>

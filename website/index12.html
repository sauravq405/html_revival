<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first website with iframes/embedded website</title>
</head>
<body>
    <!-- iframes/websites embedding-->
    <!-- embed content from another website into your html
        used for ads, also used in many hacking techniques-->

    <iframe src="https://www.google.com/"></iframe> <!-- Google doesn't support iframe because it might advantage hackers-->
    <br />
    <iframe src="https://www.bing.com/"></iframe> <!-- Bing doesn't support iframe because it might advantage hackers-->
    <br />
    <iframe src="https://www.dogpile.com/" width="750" height="250"></iframe> 
    <br />
    <iframe src="https://www.wolframalpha.com/" width="750" height="250"></iframe> 
    <br />
    <iframe src="https://duckduckgo.com/" width="750" height="250"></iframe> 
    
</body>
</html>

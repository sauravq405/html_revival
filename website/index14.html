<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first website with forms</title>
</head>
<body>

    <!--Form tags-->
    <form action="action_page.php" method="post">
        <div>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" placeholder="Spongebob" required>
        </div>
         <br />
        <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" placeholder="Squarepants" required>
        </div>
        <br />
        <div>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="pwd" placeholder="January@2026" maxlength="12" required>
        </div>
        <br />
        <div>
            <label for="mail">Email:</label>
            <input type="email" id="mail" name="mail" placeholder="Elvin@hotmail.com" required>
        </div>
        <br />
        <div>
            <label for="phone">Telephone number:</label>
            <input type="email" id="phone" name="phone" placeholder="+91-9050674321" required>
        </div>
        <br />
        <div>
            <label for="dob">Birthdate:</label>
            <input type="date" id="dob" name="dob" required>
        </div>
        <br />
        <div>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="99" value="0" required>
        </div>
        <br />
        <div>
            <label for="title">Title:</label>
            
            <label for="Mr.">Mr.</label>
            <input type="radio" id="Mr." name="title" value="Mr.">

            <label for="Mrs.">Mrs.</label>
            <input type="radio" id="Mrs." name="title" value="Mrs.">

            <label for="PhD.">PhD.</label>
            <input type="radio" id="PhD." name="title" value="PhD.">
        </div>
        <br />
        <div>
            <label for="payment">Payment:</label>
            <select id="payment" name="payment">
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="giftcard">Giftcard</option>
                <option value="upi">UPI</option>
            </select>
        </div>
        <br />
        <div>
            <label for="subscribe">Subscribe:</label>
            <input type="checkbox" id="subscribe" name="subscribe">
        </div>
        <br />
        <div>
            <input type="reset">
            <input type="submit">
        </div>
    </form>
    
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>A HREF Example</title>
  </head>
  <body>
    <a
      href="https://www.google.com/"
      target="_blank"
      title="This link takes you to Google"
    >
      <!--target="_blank" will open the link in a new tab-->
      <!--target="_self" will open the link in same tab-->
      <!--title="msg" this will show a small tool tip-->
      Google
    </a>
    <br />
    <br />
    <a
      href="page2.html"
      target="_blank"
      title="This link takes you to page2"
    >
      <!--target="_blank" will open the link in a new tab-->
      <!--target="_self" will open the link in same tab-->
      <!--title="msg" this will show a small tool tip-->
      Go to page2
    </a>
    <br />
    <br />
    <a
      href="mailto:fake123@gmail.com"
      target="_blank"
      title="Send email to fake123@gmail.com"
    >
      <!--target="_blank" will open the link in a new tab-->
      <!--target="_self" will open the link in same tab-->
      <!--title="msg" this will show a small tool tip-->
      Email
    </a>
  </body>
</html>
